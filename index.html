<script>
window.autoFmtTime = function(v){
  if(!v) return "";
  var persianMap = {"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
  var en = "";
  for(var i=0;i<v.length;i++){ var ch=v[i]; en+=persianMap[ch]!==undefined?persianMap[ch]:ch; }
  v=en.trim().replace(/[^0-9:]/g,"");
  if(!v) return "";
  if(/^\d{1,2}$/.test(v)){
    var h=parseInt(v,10);
    if(h>=0 && h<=23) return (h<10?"0"+h:h)+":00";
  }
  if(v.indexOf(":")>=0){
    var parts=v.split(":");
    var hh=parseInt(parts[0]||"0",10);
    var mm=parseInt(parts[1]||"0",10);
    if(isNaN(hh)) hh=0; if(isNaN(mm)) mm=0;
    if(hh>=0 && hh<=23 && mm>=0 && mm<=59){
      return (hh<10?"0"+hh:hh)+":"+(mm<10?"0"+mm:mm);
    }
  }
  return v;
};
</script>


<script>
(function(){
  function fmt(v){
    if(!v) return v;
    var map={"۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9","٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9"};
    var en=""; for(var i=0;i<v.length;i++){var ch=v[i]; en+=map[ch]!==undefined?map[ch]:ch;}
    v=en.trim().replace(/[^0-9:]/g,"");
    if(!v) return "";
    if(/^\d{1,2}$/.test(v)){var h=parseInt(v,10); if(h>=0&&h<=23) return (h<10?"0"+h:h)+":00";}
    if(v.indexOf(":")>=0){var a=v.split(":"); var hh=parseInt(a[0]||"0",10); var mm=parseInt(a[1]||"0",10); if(hh>=0&&hh<=23&&mm>=0&&mm<=59) return (hh<10?"0"+hh:hh)+":"+(mm<10?"0"+mm:mm);}
    return "";
  }
  try{
    var keys=["modir-khune-cleaning","cleaning","modir-khune-weekly","weekly"];
    keys.forEach(function(k){
      var raw=localStorage.getItem(k);
      if(!raw) return;
      try{
        var arr=JSON.parse(raw);
        if(!Array.isArray(arr)) return;
        var changed=false;
        arr.forEach(function(it){
          if(it.from!==undefined){
            var f=fmt(it.from);
            if(f && f!==it.from){ it.from=f; changed=true; }
          }
          if(it.to!==undefined){
            var t=fmt(it.to);
            // Only fix if to looks like time (digits), not if it's text like "باشگاه فوتبال"
            // If original to contains letters and fmt returns "", keep original? No, we want to fix only if it was meant to be time
            // So if original contains digits, fix it
            if(it.to && /\d/.test(it.to)){
              if(t && t!==it.to){ it.to=t; changed=true; }
            }
          }
        });
        if(changed){ localStorage.setItem(k, JSON.stringify(arr)); console.log("migrated",k); }
      }catch(e){}
    });
  }catch(e){}
})();
</script>

: "Πεδία μεσημεριανού και βραδινού"}, "کنار هر ورودی یک دکمه‌ی «پیشنهاد» هست که با توجه به موجودی خانه یک غذا پیشنهاد می‌دهد و در ورودی می‌نویسد؛ بعد می‌توانی دستی تغییرش بدهی.": {"en": "For each day there are two fully manual inputs; write any food you like and it sits into the plan itself (in this session).", "el": "Για κάθε ημέρα υπάρχουν δύο πλήρως χειροκίνητα πεδία· γράψε όποιο φαγητό θέλεις και μπαίνει μόνο του στο πρόγραμμα (σε αυτή τη συνεδρία)."}, "مواد غذا": {"en": "The \"Suggest\" button", "el": "Το κουμπί «Πρότεινε»"}, "اگر اسم نوشته‌شده با یکی از غذاهای فهرست یکی باشد، مواد لازمش نمایش داده می‌شود و مشخص می‌شود کدام را داری و کدام کم است. کمبودها خودکار به لیست خرید اضافه می‌شن.": {"en": "Next to each input there's a \"Suggest\" button that suggests a dish based on your home inventory and writes it into the input; then you can change it manually.", "el": "Δίπλα σε κάθε πεδίο υπάρχει ένα κουμπί «Πρότεινε» που προτείνει ένα φαγητό με βάση το απόθεμα του σπιτιού και το γράφει στο πεδίο· μετά μπορείς να το αλλάξεις χειροκίνητα."}, "فهرست غذاها": {"en": "Dish ingredients", "el": "Υλικά φαγητού"}, "پایین صفحه فهرست غذاهاست: با «+ افزودن غذا» غذای جدید (نام و مواد با ویرگول جدا کن) اضافه کن؛ با مداد ✏️ ویرایش و با سطل 🗑️ حذف کن.": {"en": "If the written name matches one of the dishes in the list, its required ingredients are shown, marking which you have and which are missing. Shortages are automatically added to the shopping list.", "el": "Αν το γραμμένο όνομα ταιριάζει με ένα από τα φαγητά της λίστας, εμφανίζονται τα απαραίτητα υλικά του, δείχνοντας ποια έχεις και ποια λείπουν. Οι ελλείψεις προστίθενται αυτόματα στη λίστα αγορών."}, "تغییرات به‌صورت خودکار در همین دستگاه ذخیره می‌شود و با بستن و باز کردن دوباره‌ی برنامه حفظ می‌ماند.": {"en": "Dish list", "el": "Λίστα φαγητών"}, "راهنمای بخش موجودی خونه": {"en": "At the bottom of the page is the dish list: add a new dish with \"+ Add dish\" (separate name and ingredients with commas); edit with the pencil ✏️ and delete with the bin 🗑️.", "el": "Στο κάτω μέρος της σελίδας είναι η λίστα φαγητών: με το «+ Προσθήκη φαγητού» προσθέτεις νέο φαγητό (χώρισε όνομα και υλικά με κόμμα)· επεξεργάζεσαι με το μολύβι ✏️ και διαγράφεις με τον κάδο 🗑️."}, "دسته‌بندی‌ها": {"en": "Changes are saved automatically on this device and persist when you close and reopen the app.", "el": "Οι αλλαγές αποθηκεύονται αυτόματα σε αυτή τη συσκευή και διατηρούνται όταν κλείσεις και ξανανοίξεις την εφαρμογή."}, "اقلام بر اساس دسته‌ای که خودت موقع ثبت نوشتی گروه‌بندی می‌شن؛ دسته‌ی جدید هم خودکار ساخته می‌شود.": {"en": "Home inventory section guide", "el": "Οδηγός ενότητας αποθέματος σπιτιού"}, "«+ افزودن قلم جدید»": {"en": "\"+ Add new item\"", "el": "\"+ Προσθήκη νέου είδους\""}, "نام، مقدار و دسته را دستی بنویس و ذخیره کن. نام دقیق مواد مهم است چون پیشنهادهای غذا با همین نام‌ها کار می‌کنند.": {"en": "Items are grouped by the category you wrote when registering; a new category is created automatically.", "el": "Τα είδη ομαδοποιούνται με βάση την κατηγορία που έγραψες κατά την καταχώρηση· νέα κατηγορία δημιουργείται αυτόματα."}, "ویرایش و حذف": {"en": "\"+ Add new item\"", "el": "«+ Προσθήκη νέου είδους»"}, "کنار هر قلم یک مداد ✏️ برای ویرایش و یک سطل 🗑️ برای حذف هست.": {"en": "Write the name, amount and category manually and save. The exact ingredient name matters because food suggestions work with these names.", "el": "Γράψε χειροκίνητα το όνομα, την ποσότητα και την κατηγορία και αποθήκευσε. Το ακριβές όνομα των υλικών έχει σημασία γιατί οι προτάσεις φαγητών δουλεύουν με αυτά τα ονόματα."}, "این فهرست، موتور پیشنهادهای غذاست: هر غذایی که همه‌ی موادش را داشته باشی، نشان «موادش رو داری» می‌گیرد.": {"en": "Edit and delete", "el": "Επεξεργασία και διαγραφή"}, "راهنمای لیست خرید هفتگی": {"en": "Next to each item there's a pencil ✏️ for editing and a bin 🗑️ for deleting.", "el": "Δίπλα σε κάθε είδος υπάρχει ένα μολύβι ✏️ για επεξεργασία και ένας κάδος 🗑️ για διαγραφή."}, "اقلام دستی": {"en": "This list is the engine of food suggestions: any dish whose ingredients you fully have gets the \"you have its ingredients\" badge.", "el": "Αυτή η λίστα είναι η μηχανή των προτάσεων φαγητών: κάθε φαγητό του οποίου έχεις όλα τα υλικά παίρνει το σήμα «έχεις τα υλικά του»."}, "چیزهایی که خودت لازم داری: با «+ افزودن قلم» اضافه کن و با مداد ✏️ و سطل 🗑️ ویرایش و حذف کن.": {"en": "Weekly shopping list guide", "el": "Οδηγός εβδομαδιαίας λίστας αγορών"}, "کمبودهای برنامه غذایی": {"en": "Manual items", "el": "Χειροκίνητα είδη"}, "موادی که برای غذاهای هفته کم داری، خودکار اینجا می‌آیند و نشان «از برنامه غذایی» دارن.": {"en": "Things you need yourself: add with \"+ Add item\" and edit/delete with the pencil ✏️ and bin 🗑️.", "el": "Πράγματα που χρειάζεσαι ο ίδιος: πρόσθεσέ τα με «+ Προσθήκη είδους» και επεξεργάσου/διέγραψέ τα με το μολύβι ✏️ και τον κάδο 🗑️."}, "«پنهان برای این نشست»": {"en": "Meal plan shortages", "el": "Ελλείψεις προγράμματος γευμάτων"}, "اگر قلمی از کمبودها را نمی‌خواهی بخری، با این دکمه فقط برای همین نشست پنهانش کن.": {"en": "Ingredients you're missing for the week's dishes come here automatically and carry the \"from meal plan\" badge.", "el": "Τα υλικά που σου λείπουν για τα φαγητά της εβδομάδας έρχονται εδώ αυτόματα και φέρουν το σήμα «από το πρόγραμμα γευμάτων»."}, "موقع خرید، از همین لیست به‌عنوان چک‌لیست چشمی استفاده کن.": {"en": "\"Hide for this session\"", "el": "«Απόκρυψη για αυτή τη συνεδρία»"}, "راهنمای بخش نظافت": {"en": "If you don't want to buy an item from the shortages, hide it just for this session with this button.", "el": "Αν δεν θέλεις να αγοράσεις ένα είδος από τις ελλείψεις, απόκρυψέ το μόνο για αυτή τη συνεδρία με αυτό το κουμπί."}, "خلاصه‌ی هفته": {"en": "While shopping, use this list as a visual checklist.", "el": "Κατά τα ψώνια, χρησιμοποίησε αυτή τη λίστα ως οπτική λίστα ελέγχου."}, "تعداد کارها و تعداد روزهایی که برنامه دارن را نشان می‌دهد.": {"en": "Cleaning section guide", "el": "Οδηγός ενότητας καθαριότητας"}, "روزهای هفته": {"en": "Week summary", "el": "Σύνοψη εβδομάδας"}, "کارها زیر هر روز هفته آمده‌اند؛ روز امروز مشخص است.": {"en": "Shows the number of tasks and the number of days that have a schedule.", "el": "Δείχνει τον αριθμό των εργασιών και τον αριθμό των ημερών που έχουν πρόγραμμα."}, "«+ افزودن کار»": {"en": "\"+ Add task\"", "el": "\"+ Προσθήκη εργασίας\""}, "عنوان، تناوب (مثلاً روزانه / هفتگی / ماهانه) و روزها را دستی بنویس؛ روزها را با ویرگول جدا کن (مثلاً شنبه، دوشنبه).": {"en": "Tasks are listed under each weekday; today is highlighted.", "el": "Οι εργασίες αναγράφονται κάτω από κάθε ημέρα της εβδομάδας· η σημερινή ημέρα είναι επισημασμένη."}, "کنار هر کار یک مداد ✏️ برای ویرایش و یک سطل 🗑️ برای حذف هست.": {"en": "\"+ Add task\"", "el": "«+ Προσθήκη εργασίας»"}, "به‌جای اینکه همه‌ی کارها تلنبار بشن، هر روز فقط چند کار سبک داری و خونه همیشه مرتب می‌مونه.": {"en": "Write the title, frequency (e.g. daily / weekly / monthly) and days manually; separate days with commas (e.g. Saturday, Monday).", "el": "Γράψε χειροκίνητα τον τίτλο, τη συχνότητα (π.χ. καθημερινά / εβδομαδιαία / μηνιαία) και τις ημέρες· χώρισε τις ημέρες με κόμμα (π.χ. Σάββατο, Δευτέρα)."}, "راهنمای قرارها و مناسبت‌ها": {"en": "Next to each task there's a pencil ✏️ for editing and a bin 🗑️ for deleting.", "el": "Δίπλα σε κάθε εργασία υπάρχει ένα μολύβι ✏️ για επεξεργασία και ένας κάδος 🗑️ για διαγραφή."}, "قرار ملاقات‌ها": {"en": "Instead of all tasks piling up, each day you only have a few light tasks and the house always stays tidy.", "el": "Αντί να συσσωρεύονται όλες οι εργασίες, κάθε ημέρα έχεις μόνο λίγες ελαφριές εργασίες και το σπίτι μένει πάντα τακτοποιημένο."}, "عنوان، اسم بچه، تاریخ، ساعت، «چند روز مانده» و یادداشت؛ همه دستی و قابل ویرایش. با «+ افزودن قرار» مورد جدید بساز و با مداد ✏️ و سطل 🗑️ ویرایش و حذف کن.": {"en": "Appointments and events guide", "el": "Οδηγός ραντεβού και εκδηλώσεων"}, "مناسبت‌ها": {"en": "Occasions", "el": "Περιστάσεις"}, "عنوان، تاریخ، «چند روز مانده» و یادداشت؛ با «+ افزودن مناسبت» اضافه کن و با مداد ✏️ و سطل 🗑️ ویرایش و حذف کن.": {"en": "Title, child's name, date, time, \"days left\" and note; all manual and editable. Create a new one with \"+ Add appointment\" and edit/delete with the pencil ✏️ and bin 🗑️.", "el": "Τίτλος, όνομα παιδιού, ημερομηνία, ώρα, «ημέρες που απομένουν» και σημείωση· όλα χειροκίνητα και επεξεργάσιμα. Δημιούργησε νέο με «+ Προσθήκη ραντεβού» και επεξεργάσου/διέγραψε με το μολύβι ✏️ και τον κάδο 🗑️."}, "قرار دکتر، کلاس و تولدها دیگه یادت نمی‌ره؛ شمارش معکوس هم کمک می‌کنه به‌موقع آماده بشی.": {"en": "Events", "el": "Εκδηλώσεις"}, "راهنمای بخش مالی": {"en": "Title, date, \"days left\" and note; add with \"+ Add event\" and edit/delete with the pencil ✏️ and bin 🗑️.", "el": "Τίτλος, ημερομηνία, «ημέρες που απομένουν» και σημείωση· πρόσθεσέ τα με «+ Προσθήκη εκδήλωσης» και επεξεργάσου/διέγραψε με το μολύβι ✏️ και τον κάδο 🗑️."}, "مبالغ خرید": {"en": "You won't forget doctor appointments, classes and birthdays anymore; the countdown helps you get ready on time.", "el": "Δεν θα ξεχάσεις πια τα ραντεβού με τον γιατρό, τα μαθήματα και τα γενέθλια· η αντίστροφη μέτρηση σε βοηθά να ετοιμαστείς στην ώρα σου."}, "نام قلم، فروشگاه، مبلغ (به تومان)، تاریخ و یادداشت؛ همه دستی. با «+ افزودن خرید» ثبت کن و با مداد ✏️ و سطل 🗑️ ویرایش و حذف کن. جمع کل پایین پنل حساب می‌شود.": {"en": "Finance section guide", "el": "Οδηγός ενότητας οικονομικών"}, "دریافتی بچه‌ها": {"en": "Purchase amounts", "el": "Ποσά αγορών"}, "اسم بچه، مبلغ، تاریخ و دلیل؛ با «+ افزودن دریافتی» ثبت کن و با مداد ✏️ و سطل 🗑️ ویرایش و حذف کن. جمع هر بچه و جمع کل خودکار حساب می‌شود.": {"en": "Item name, store, amount (in tomans), date and note; all manual. Record with \"+ Add purchase\" and edit/delete with the pencil ✏️ and bin 🗑️. The grand total is calculated at the bottom of the panel.", "el": "Όνομα είδους, κατάστημα, ποσό (σε τομάν), ημερομηνία και σημείωση· όλα χειροκίνητα. Καταχώρησε με «+ Προσθήκη αγοράς» και επεξεργάσου/διέγραψε με το μολύβι ✏️ και τον κάδο 🗑️. Το γενικό σύνολο υπολογίζεται στο κάτω μέρος του πίνακα."}, "فقط برای اینکه بدونی این هفته چقدر خرید کردی و بچه‌ها چقدر گرفتن؛ ساده و سریع.": {"en": "Kids' income", "el": "Έσοδα παιδιών"}, "راهنمای ظاهر و تم": {"en": "Child's name, amount, date and reason; record with \"+ Add income\" and edit/delete with the pencil ✏️ and bin 🗑️. Each child's total and the grand total are calculated automatically.", "el": "Όνομα παιδιού, ποσό, ημερομηνία και αιτιολογία· καταχώρησε με «+ Προσθήκη εσόδου» και επεξεργάσου/διέγραψε με το μολύβι ✏️ και τον κάδο 🗑️. Το σύνολο κάθε παιδιού και το γενικό σύνολο υπολογίζονται αυτόματα."}, "رنگ تم": {"en": "Just so you know how much you spent shopping this week and how much the kids received; simple and fast.", "el": "Απλώς για να ξέρεις πόσα ξόδεψες για ψώνια αυτή την εβδομάδα και πόσα πήραν τα παιδιά· απλά και γρήγορα."}, "یکی از پنج تم را انتخاب کن؛ رنگ کل برنامه — پس‌زمینه، کارت‌ها، دکمه‌ها و لهجه‌ها — فوراً عوض می‌شود و انتخابت برای دفعه‌های بعد ذخیره می‌ماند.": {"en": "Appearance and theme guide", "el": "Οδηγός εμφάνισης και θέματος"}, "پس‌زمینه": {"en": "Theme color", "el": "Χρώμα θέματος"}, "می‌توانی پس‌زمینه را ساده نگه داری یا یکی از دو عکس تار «خونه گرم» و «آشپزخونه روشن» را بگذاری. روی عکس، لایه‌ای هماهنگ با تم کشیده می‌شود تا نوشته‌ها خوانا بمانند و کارت‌ها کمی شیشه‌ای می‌شوند.": {"en": "Pick one of the five themes; the whole app's color — background, cards, buttons and accents — changes instantly and your choice stays saved for next time.", "el": "Διάλεξε ένα από τα πέντε θέματα· το χρώμα όλης της εφαρμογής — φόντο, κάρτες, κουμπιά και τονισμοί — αλλάζει αμέσως και η επιλογή σου παραμένει αποθηκευμένη για την επόμενη φορά."}, "حالت شب / روز": {"en": "Background", "el": "Φόντο"}, "بالای رنگ‌ها یک کلید شب/روز (🌙/☀️) هست؛ با زدن آن، همین رنگی که انتخاب کرده‌ای نسخه‌ی شبش را می‌گیرد: پس‌زمینه تیره می‌شود ولی لهجه‌ی رنگی حفظ می‌ماند و همه‌ی نوشته‌ها روشن و خوانا می‌مانند. مثلاً «سفید آبی» در شب سرمه‌ای تیره، «قهوه‌ای نارنجی» شکلاتی تیره، «سبز» جنگلی تیره و «صورتی» عنابی تیره می‌شود.": {"en": "You can keep the background simple or set one of the two blurred photos \"Cozy home\" and \"Bright kitchen\". On the photo, a layer harmonized with the theme is drawn so texts stay readable and cards become slightly glassy.", "el": "Μπορείς να κρατήσεις το φόντο απλό ή να βάλεις μία από τις δύο θολές φωτογραφίες «Ζεστό σπίτι» και «Φωτεινή κουζίνα». Πάνω στη φωτογραφία απλώνεται ένα στρώμα εναρμονισμένο με το θέμα ώστε τα κείμενα να μένουν ευανάγνωστα και οι κάρτες γίνονται ελαφρώς γυάλινες."}, "چرا رنگ‌ها در تلگرام فرق می‌کند؟": {"en": "Night / day mode", "el": "Νυχτερινή / ημερήσια λειτουργία"}, "مرورگرهای داخل بعضی برنامه‌ها (مثل مرورگر داخلی تلگرام) رنگ‌ها را کمی متفاوت‌تر از مرورگر اصلی گوشی نشان می‌دهند؛ برای همین انتخاب تم به خودت سپرده شده تا هر طور راحت‌تری ببینی.": {"en": "Above the colors there's a night/day switch (🌙/☀️); tapping it turns your chosen color into its night version: the background darkens but the color accent is kept and all texts stay bright and readable. E.g. \"White blue\" becomes dark navy at night, \"Brown orange\" dark chocolate, \"Green\" dark forest and \"Pink\" dark burgundy.", "el": "Πάνω από τα χρώματα υπάρχει ένας διακόπτης νύχτας/ημέρας (🌙/☀️)· πατώντας τον, το χρώμα που διάλεξες παίρνει τη νυχτερινή του εκδοχή: το φόντο σκουραίνει αλλά ο χρωματικός τονισμός διατηρείται και όλα τα κείμενα μένουν φωτεινά και ευανάγνωστα. Π.χ. το «Λευκό μπλε» γίνεται σκούρο ναυτικό τη νύχτα, το «Καφέ πορτοκαλί» σκούρα σοκολάτα, το «Πράσινο» σκούρο δασικό και το «Ροζ» σκούρο μπορντό."}, "انتخاب رنگ و حالت شب/روز هر دو ذخیره می‌شوند و دفعه‌ی بعد هم همین‌طور باز می‌شوند. اگر خوانایی کم شد، حالت شب یا گزینه‌ی «بدون پس‌زمینه» را امتحان کن.": {"en": "Why do colors look different in Telegram?", "el": "Γιατί τα χρώματα φαίνονται διαφορετικά στο Telegram;"}, "راهنمای تنظیمات": {"en": "Browsers inside some apps (like Telegram's in-app browser) show colors slightly differently than the phone's main browser; that's why the theme choice is left to you, so you see it however is most comfortable.", "el": "Οι φυλλομετρητές μέσα σε κάποιες εφαρμογές (όπως ο ενσωματωμένος φυλλομετρητής του Telegram) δείχνουν τα χρώματα ελαφρώς διαφορετικά από τον κύριο φυλλομετρητή του τηλεφώνου· γι' αυτό η επιλογή θέματος αφήνεται σε σένα, για να το βλέπεις όπως σε βολεύει."}, "درباره‌ی برنامه": {"en": "Both the color choice and the night/day mode are saved and open the same next time. If readability drops, try the night mode or the \"No background\" option.", "el": "Τόσο η επιλογή χρώματος όσο και η νυχτερινή/ημερήσια λειτουργία αποθηκεύονται και ανοίγουν το ίδιο την επόμενη φορά. Αν η αναγνωσιμότητα μειωθεί, δοκίμασε τη νυχτερινή λειτουργία ή την επιλογή «Χωρίς φόντο»."}, "توضیح کوتاه «مدیر خونه» و اینکه کاملاً آفلاین و نمایشی است.": {"en": "Settings guide", "el": "Οδηγός ρυθμίσεων"}, "پشتیبان‌گیری": {"en": "About the app", "el": "Σχετικά με την εφαρμογή"}, "با «دانلود فایل پشتیبان» از همه‌ی اطلاعات برنامه (غذاها، موجودی خونه، لیست خرید، نظافت، قرارها، مناسبت‌ها و مالی) یک فایل JSON با نام backup-YYYY-MM-DD.json می‌گیری. این فایل را جای امن نگه دار تا اگر چیزی پاک شد، بتوانی برگردانی.": {"en": "A short description of \"Home Manager\" and that it's fully offline and a demo.", "el": "Μια σύντομη περιγραφή του «Διαχειριστή σπιτιού» και ότι είναι πλήρως εκτός σύνδεσης και δοκιμαστικό."}, "انتخاب محل پشتیبان‌گیری": {"en": "Backup", "el": "Αντίγραφο ασφαλείας"}, "با این دکمه یک پوشه (مثلاً «مدیر خونه») انتخاب می‌کنی تا فایل‌های پشتیبان مستقیم همان‌جا ذخیره شوند. انتخابت در مرورگر ذخیره می‌شود و فقط یک بار لازم است انجامش بدهی. اگر مرورگرت این قابلیت را نداشته باشد (مثلاً سافاری آیفون)، فایل در پوشه دانلودها ذخیره می‌شود.": {"en": "With \"Download backup file\" you get a JSON file named backup-YYYY-MM-DD.json of all the app's data (dishes, home inventory, shopping list, cleaning, appointments, events and finances). Keep this file somewhere safe so you can restore if anything gets deleted.", "el": "Με το «Λήψη αρχείου αντιγράφου ασφαλείας» παίρνεις ένα αρχείο JSON με όνομα backup-YYYY-MM-DD.json με όλα τα δεδομένα της εφαρμογής (φαγητά, απόθεμα σπιτιού, λίστα αγορών, καθαριότητα, ραντεβού, εκδηλώσεις και οικονομικά). Κράτα αυτό το αρχείο σε ασφαλές μέρος για να μπορέσεις να επαναφέρεις αν διαγραφεί κάτι."}, "پشتیبان‌گیری خودکار شبانه": {"en": "Choose backup location", "el": "Επιλογή τοποθεσίας αντιγράφου ασφαλείας"}, "اگر روشن باشد، هر شب ساعت ۲۳:۵۵ وقتی برنامه باز است خودکار پشتیبان می‌گیرد؛ اگر آن شب برنامه باز نبود، در اجرای بعدی جبران می‌شود. راستش را بخواهی، مرورگر وقتی بسته است نمی‌تواند کاری انجام بدهد؛ پس این قابلیت وقتی کار می‌کند که برنامه موقع ۲۳:۵۵ باز باشد، یا در اجرای بعدی.": {"en": "With this button you choose a folder (e.g. \"Home Manager\") so backup files are saved directly there. Your choice is saved in the browser and you only need to do it once. If your browser doesn't support this feature (e.g. iPhone Safari), the file is saved in the downloads folder.", "el": "Με αυτό το κουμπί διαλέγεις έναν φάκελο (π.χ. «Διαχειριστής σπιτιού») ώστε τα αρχεία αντιγράφων ασφαλείας να αποθηκεύονται απευθείας εκεί. Η επιλογή σου αποθηκεύεται στον φυλλομετρητή και χρειάζεται να το κάνεις μόνο μία φορά. Αν ο φυλλομετρητής σου δεν υποστηρίζει αυτή τη δυνατότητα (π.χ. Safari iPhone), το αρχείο αποθηκεύεται στον φάκελο λήψεων."}, "بازیابی از فایل": {"en": "Automatic nightly backup", "el": "Αυτόματο νυχτερινό αντίγραφο ασφαλείας"}, "یک فایل پشتیبان قبلی را انتخاب می‌کنی؛ بعد از تأیید، همه‌ی اطلاعات فعلی با اطلاعات آن فایل جایگزین می‌شود. قبلش مطمئن شو فایل درستی انتخاب کرده‌ای.": {"en": "If enabled, every night at 23:55 it automatically backs up while the app is open; if the app wasn't open that night, it's made up on the next run. Truthfully, the browser can't do anything while closed; so this feature works when the app is open at 23:55, or on the next run.", "el": "Αν είναι ενεργοποιημένο, κάθε βράδυ στις 23:55 παίρνει αυτόματα αντίγραφο ασφαλείας ενώ η εφαρμογή είναι ανοιχτή· αν εκείνο το βράδυ η εφαρμογή δεν ήταν ανοιχτή, αναπληρώνεται στην επόμενη εκτέλεση. Για να είμαστε ειλικρινείς, ο φυλλομετρητής δεν μπορεί να κάνει τίποτα ενώ είναι κλειστός· οπότε αυτή η δυνατότητα δουλεύει όταν η εφαρμογή είναι ανοιχτή στις 23:55, ή στην επόμενη εκτέλεση."}, "ریست نرم‌افزار": {"en": "Restore from file", "el": "Επαναφορά από αρχείο"}, "دو گزینه دارد: «حذف کامل همه‌چیز» همه‌ی اطلاعات را — حتی نمونه‌های پیش‌فرض — پاک می‌کند و برنامه کاملاً خالی می‌شود تا خودت از اول وارد کنی؛ «بازگشت به حالت اولیه» اطلاعات تو را پاک می‌کند ولی نمونه‌های پیش‌فرض را برمی‌گرداند. هر دو گزینه برگشت‌ناپذیرند، پس اول «دانلود فایل پشتیبان» را بزن.": {"en": "You select a previous backup file; after confirmation, all current data is replaced with that file's data. Make sure you've selected the right file first.", "el": "Διαλέγεις ένα προηγούμενο αρχείο αντιγράφου ασφαλείας· μετά την επιβεβαίωση, όλα τα τρέχοντα δεδομένα αντικαθίστανται με τα δεδομένα εκείνου του αρχείου. Βεβαιώσου πρώτα ότι διάλεξες το σωστό αρχείο."}, "بخش‌های برنامه": {"en": "Software reset", "el": "Επαναφορά λογισμικού"}, "فهرست همه‌ی بخش‌ها با یک خط توضیح.": {"en": "It has two options: \"Delete everything completely\" erases all data — even the default samples — and the app starts fully empty for you to enter from scratch; \"Restore to initial state\" erases your data but brings back the default samples. Both options are irreversible, so tap \"Download backup file\" first.", "el": "Έχει δύο επιλογές: το «Διαγραφή όλων πλήρως» σβήνει όλα τα δεδομένα — ακόμα και τα προεπιλεγμένα δείγματα — και η εφαρμογή ξεκινά εντελώς άδεια για να καταχωρήσεις από την αρχή· το «Επαναφορά στην αρχική κατάσταση» σβήνει τα δεδομένα σου αλλά επαναφέρει τα προεπιλεγμένα δείγματα. Και οι δύο επιλογές είναι μη αναστρέψιμες, οπότε πάτα πρώτα «Λήψη αρχείου αντιγράφου ασφαλείας»."}, "ذخیره‌سازی خودکار": {"en": "Auto-save", "el": "Αυτόματη αποθήκευση"}, "تغییرات به‌صورت خودکار در حافظه‌ی همین دستگاه ذخیره می‌شود و با بستن و باز کردن برنامه حفظ می‌ماند؛ وضعیت ذخیره‌سازی را می‌توانی پایین همین صفحه ببینی.": {"en": "A list of all sections with a one-line description.", "el": "Λίστα όλων των ενοτήτων με περιγραφή μίας γραμμής."}, "اگر از داخل تلگرام باز می‌کنی": {"en": "Automatic saving", "el": "Αυτόματη αποθήκευση"}, "مرورگر داخلی تلگرام گاهی حافظه را بین دو بازدید پاک می‌کند؛ اگر روزی اطلاعاتت ناپدید شد، مرتب «دانلود فایل پشتیبان» بگیر و با «بازیابی از فایل» برگردان، یا فایل را در مرورگر اصلی گوشی (کروم/سافاری) باز کن که ذخیره‌سازی مطمئن‌تر است.": {"en": "Changes are automatically saved in this device's memory and persist when you close and reopen the app; you can see the storage status at the bottom of this page.", "el": "Οι αλλαγές αποθηκεύονται αυτόματα στη μνήμη αυτής της συσκευής και διατηρούνται όταν κλείνεις και ξανανοίγεις την εφαρμογή· μπορείς να δεις την κατάσταση αποθήκευσης στο κάτω μέρος αυτής της σελίδας."}, "مشخصات سازنده را در پایین صفحه ببین.": {"en": "If you're opening from inside Telegram", "el": "Αν ανοίγεις από μέσα από το Telegram"}, "راهنمای بخش": {"en": "Telegram's in-app browser sometimes clears memory between visits; if your data ever disappears, regularly tap \"Download backup file\" and restore with \"Restore from file\", or open the file in the phone's main browser (Chrome/Safari) where storage is more reliable.", "el": "Ο ενσωματωμένος φυλλομετρητής του Telegram μερικές φορές καθαρίζει τη μνήμη μεταξύ επισκέψεων· αν τα δεδομένα σου εξαφανιστούν ποτέ, πάτα τακτικά «Λήψη αρχείου αντιγράφου ασφαλείας» και επανάφερε με «Επαναφορά από αρχείο», ή άνοιξε το αρχείο στον κύριο φυλλομετρητή του τηλεφώνου (Chrome/Safari) όπου η αποθήκευση είναι πιο αξιόπιστη."}, "؟": {"en": "?", "el": "?"}, "بستن": {"en": "Section guide", "el": "Οδηγός ενότητας"}, "ذخیره": {"en": "Save", "el": "Αποθήκευση"}, "انصراف": {"en": "Cancel", "el": "Ακύρωση"}, "💾 تغییرات (افزودن، ویرایش و حذف) به‌صورت خودکار در همین دستگاه ذخیره می‌شود؛ با بستن و باز کردن دوباره‌ی برنامه، اطلاعاتت سر جاشه.": {"en": "Save", "el": "Αποθήκευση"}, "طراحی شده توسط امید بهادری — آیدی تلگرام": {"en": "Cancel", "el": "Ακύρωση"}, "قلم موجودی خونه": {"en": "💾 Changes (adding, editing and deleting) are saved automatically on this device; when you close and reopen the app, your data is in its place.", "el": "💾 Οι αλλαγές (προσθήκη, επεξεργασία και διαγραφή) αποθηκεύονται αυτόματα σε αυτή τη συσκευή· όταν κλείνεις και ξανανοίγεις την εφαρμογή, τα δεδομένα σου είναι στη θέση τους."}, "وعده برنامه‌ریزی‌شده": {"en": "Designed by Omid Bahadori — Telegram ID", "el": "Σχεδιάστηκε από τον Ομίντ Μπαχαντορί — ID Telegram"}, "قرار هفته آینده": {"en": "Home inventory item", "el": "Είδος αποθέματος σπιτιού"}, "جمع مبالغ خرید": {"en": "Planned meal", "el": "Προγραμματισμένο γεύμα"}, "خانه": {"en": "Home", "el": "Αρχική"}, "امروز": {"en": "Today", "el": "Σήμερα"}, "،": {"en": "Home", "el": "Αρχική"}, "خونه‌ت مرتبه، روزت بخیر! 🌷": {"en": "Today", "el": "Σήμερα"}, "برنامه کامل نظافت": {"en": ",", "el": ","}, "برای امروز کاری ثبت نشده.": {"en": "No tasks recorded for today.", "el": "Δεν καταγράφηκε καμία εργασία για σήμερα."}, "غذای هفته": {"en": "Meal plan of the week", "el": "Γεύματα της εβδομάδας"}, "ناهار": {"en": "Lunch", "el": "Μεσημεριανό"}, "شام": {"en": "Dinner", "el": "Βραδινό"}, "همه": {"en": "All", "el": "Όλα"}, "ساعت": {"en": "hour", "el": "ώρα"}, "در ۷ روز آینده قرار یا مناسبتی نیست.": {"en": "No appointments or events in the next 7 days.", "el": "Δεν υπάρχουν συναντήσεις ή εκδηλώσεις τις επόμενες 7 ημέρες."}, "صبحانه": {"en": "Breakfast", "el": "Πρωινό"}, "میان‌وعده": {"en": "Snack", "el": "Σνακ"}, "نهار": {"en": "Lunch", "el": "Μεσημεριανό"}, "عصرانه": {"en": "Afternoon snack", "el": "Απογευματινό σνακ"}, "🧺 از موجودی خونه انتخاب کن (بزن تا اضافه/حذف بشه):": {"en": "🧺 Pick from your home stock (tap to add/remove):", "el": "🧺 Διάλεξε από το απόθεμα του σπιτιού (πάτα για προσθήκη/αφαίρεση):"}, "نوع وعده": {"en": "Meal type", "el": "Είδος γεύματος"}, "موادش رو داری": {"en": var APPF_DB = "modir-khune-appfolder";
function appfIdb(){

}

async function opfsBackupsDir(){

async function appFolderSave(name, text){

      return true;
    }catch(e){}
  }
  var list = await appfGet("files") || [];
  list = list.filter(function(x){ return x.name !== name; });
  list.push({name:name, at:new Date().toISOString(), size:String(text).length, data:text});
  list.sort(function(a,b){ return a.name < b.name ? -1 : 1; });

var J_ANCHOR_UTC = Date.UTC(2021, 2, 21); /* 1 Farvardin 1400 */
function jLeap(jy){ var r = ((jy % 33) + 33) % 33; return r===1||r===5||r===9||r===13||r===17||r===22||r===26||r===30; }
function jMonthLen(jy,jm){ if(jm<=6) return 31; if(jm<=11) return 30; return jLeap(jy)?30:29; }
function jToGDate(jy,jm,jd){
  var days = 0, y = 1400, m;
  while(y < jy){ days += jLeap(y)?366:365; y++; }
  while(y > jy){ y--; days -= jLeap(y)?366:365; }
  for(m = 1; m < jm; m++) days += jMonthLen(jy,m);
  days += jd - 1;
  return new Date(J_ANCHOR_UTC + days*86400000);
}
function gToJ(gy,gm,gd){
  var days = Math.round((Date.UTC(gy,gm-1,gd) - J_ANCHOR_UTC)/86400000), jy = 1400, jm = 1, yl, ml;
  if(days >= 0){ while(true){ yl = jLeap(jy)?366:365; if(days < yl) break; days -= yl; jy++; } }
  else { while(days < 0){ jy--; days += jLeap(jy)?366:365; } }
  while(true){ ml = jMonthLen(jy,jm); if(days < ml) break; days -= ml; jm++; }
  return {jy:jy, jm:jm, jd:days+1};
}
function toJalaaliDate(dt){ return gToJ(dt.getFullYear(), dt.getMonth()+1, dt.getDate()); }
function toGregorianDate(jy,jm,jd){ var d = jToGDate(jy,jm,jd); return {gy:d.getUTCFullYear(), gm:d.getUTCMonth()+1, gd:d.getUTCDate()}; }
var J_MONTHS_FA = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
var J_MONTHS_EN = ["Farvardin","Ordibehesht","Khordad","Tir","Mordad","Shahrivar","Mehr","Aban","Azar","Dey","Bahman","Esfand"];
var J_MONTHS_EL = ["Φαρβαρντίν","Ορντιμπεχέστ","Χορντάντ","Τίρ","Μορντάντ","Σαχριβάρ","Μέρ","Αμπάν","Αζάρ","Ντέι","Μπαχμάν","Εσφάντ"];
var G_MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var G_MONTHS_EL = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];

function parseDateInput(input){
  var now = new Date(), v = (input.value || "").trim(), m = v.match(/^(\d+)\s+(.+)$/);
  if(m){
    var mname = m[2].trim(), ji = J_MONTHS_FA.indexOf(mname);
    if(ji < 0) ji = J_MONTHS_EN.indexOf(mname);
    if(ji < 0) ji = J_MONTHS_EL.indexOf(mname);
    if(ji >= 0){ var tj = toJalaaliDate(now); return {isJalali: true, jy: tj.jy, jm: ji+1}; }
    var gi = G_MONTHS_EN.indexOf(mname);
    if(gi < 0) gi = G_MONTHS_EL.indexOf(mname);
    if(gi >= 0) return {isJalali: false, gy: now.getFullYear(), gm: gi+1};
  }
  if(lang === "fa"){ var tj2 = toJalaaliDate(now); return {isJalali: true, jy: tj2.jy, jm: tj2.jm}; }
  return {isJalali: false, gy: now.getFullYear(), gm: now.getMonth()+1};
}

function renderCal(){

          ul.className='space-y-2';
          ul.style.marginTop='10px';
          container.appendChild(ul);
        }
        const emptyP=container.querySelector('p.text-xs');
        if(emptyP) emptyP.style.display='none';
        const li=document.createElement('li');
        li.className='rounded-2xl bg-[#2a2a2e] border border-[#3a3a3e] px-3 py-2.5 flex items-start justify-between gap-2';
        li.dataset.id=obj.id;
        li.innerHTML=`
          <div class="flex-1">
            <p style="font-weight:700;color:#fff;font-size:13px">${title.replace(/</g,'&lt;')}</p>
            ${(from||to)?`<p style="margin-top:2px;font-size:11px;font-weight:700;color:#fb923c">${(typeof lang!=='undefined'&&lang==='en'?'From ':lang==='el'?'Από ':'از ')}${from||'?' } ${(lang==='en'?'to':lang==='el'?'έως':'تا')} ${to||'?' }</p>`:''}
            ${note?`<p style="margin-top:2px;font-size:11px;color:#9ca3af">${note.replace(/</g,'&lt;')}</p>`:''}
          </div>
          <button type="button" onclick="event.stopPropagation(); window.__modirDel('${obj.id}', this)" style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3f1a1a;color:#fb7185;border:1px solid #5a2a2a;cursor:pointer;font-size:16px;font-weight:800;flex-shrink:0">✕</button>
        `;
        ul.appendChild(li);
        updateCounts();
      }catch(err){}
      wrap.remove();
    };
    container.appendChild(wrap);
  }

  function init(){
    const cards=[...document.querySelectorAll('div.th-card')];
    cards.forEach(card=>{
      if(card.dataset.modirReady) return;
      const txt=card.textContent||'';
      const day=DAYS.find(d=>txt.includes(d));
      if(!day) return;
      if(!txt.includes('مورد')) return;
      card.dataset.modirReady='1';
      card.style.cursor='pointer';
      card.addEventListener('click', (ev)=>{
        if(ev.target.closest('.modir-drawer')) return;
        if(ev.target.closest('button')) return;
        if(ev.target.closest('li')) return;
        createForm(day, card);
      });
    });
    // Enhance existing react items with X
    document.querySelectorAll('div.th-card ul li').forEach(li=>{
      if(li.dataset.enhanced) return;
      if(!li.textContent) return;
      // Find id
      let id=li.dataset.id;
      if(!id){
        const titleEl=li.querySelector('p.font-bold');
        if(titleEl){
          try{
            const arr=JSON.parse(localStorage.getItem('modir-khune-weekly')||'[]');
            const f=arr.find(x=>x.title===titleEl.textContent.trim());
            if(f) id=f.id;
          }catch(e){}
        }
      }
      if(!id) return;
      li.dataset.id=id;
      // Hide old buttons
      li.querySelectorAll('button').forEach(b=>{
        if(b.querySelector('svg') || (b.textContent||'').includes('حذف') || (b.textContent||'').includes('ویرایش')){
          b.style.display='none';
        }
      });
      if(!li.querySelector('.modir-x')){
        const xBtn=document.createElement('button');
        xBtn.type='button';
        xBtn.className='modir-x';
        xBtn.style.cssText='width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#3f1a1a;color:#fb7185;border:1px solid #5a2a2a;cursor:pointer;font-size:16px;font-weight:800;flex-shrink:0;margin-left:6px';
        xBtn.textContent='✕';
        xBtn.onclick=(e)=>{ e.stopPropagation(); window.__modirDel(id, xBtn); };
        const flexDiv=li.querySelector('div.flex');
        if(flexDiv) flexDiv.appendChild(xBtn);
        else li.appendChild(xBtn);
      }
      li.dataset.enhanced='1';
    });
  }

  setInterval(init, 800);
  window.addEventListener('load', init);
})();
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}} div.th-card:hover{border-color:#f97316 !important}</style>

<script>
(function(){
  function fixComma(){
    // Replace any element that only contains Persian comma or English comma near home icon
    document.querySelectorAll('*').forEach(el=>{
      if(el.children.length>0) return;
      const t=(el.textContent||'').trim();
      if(t==='،' || t===',' || t==='٬'){
        // Check if near home icon or in header
        const parent=el.parentElement;
        if(parent && (parent.innerHTML.includes('th-gradient') || parent.textContent.length<10)){
          el.textContent='خانه';
          el.style.fontSize='13px';
          el.style.fontWeight='800';
          el.style.color='#1f2937';
        }
      }
    });
    
    // More specific: find home icon container and its sibling comma
    document.querySelectorAll('div.th-card, div.flex').forEach(div=>{
      const html=div.innerHTML||'';
      if(html.includes('rounded-2xl') && html.includes('،')){
        // Look for comma text node
        div.childNodes.forEach(node=>{
          if(node.nodeType===3 && node.textContent.trim()==='،'){
            node.textContent=' خانه ';
          }
        });
      }
    });

    // Hide any remaining auto-save info boxes that might still appear via other means
    document.querySelectorAll('p, div').forEach(el=>{
      const txt=(el.textContent||'');
      if(txt.includes('تغییرات (افزودن، ویرایش و حذف)') || txt.includes('به‌صورت خودکار در همین دستگاه ذخیره می‌شود')){
        const card=el.closest('div.th-card') || el.closest('div.rounded-2xl') || el;
        // Only hide if it's the info box, not the form itself
        if(txt.length<200){
          el.style.display='none';
          if(el.parentElement && el.parentElement.children.length===1){
            el.parentElement.style.display='none';
          }
        }
      }
      if(txt.includes('طراحی شده توسط امید بهادری')){
        el.style.display='none';
        let p=el.parentElement;
        while(p && p.tagName!=='BODY'){
          if(p.className && p.className.includes('border-t')){
            p.style.display='none';
            break;
          }
          if(p.textContent.includes('طراحی شده توسط') && p.children.length<=2){
            p.style.display='none';
          }
          p=p.parentElement;
        }
      }
    });
  }
  setInterval(fixComma, 800);
  window.addEventListener('load', fixComma);
})();
</script>
</body>
