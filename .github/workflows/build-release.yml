name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets
        run: mkdir -p public && cp index.html icon.png icon-192.png manifest.json public/

      - name: Init Capacitor
        run: npx cap init "مدیر خونه" com.omidbahadori.modirkhune --web-dir=public

      - name: Add Android platform
        run: npx cap add android

      - name: Auto-increment version
        run: |
          python3 << 'PYEOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          run_no = int("${{ github.run_number }}")
          s = re.sub(r'versionCode\s+\d+', f'versionCode {run_no}', s)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_no}"', s)
          open(p, 'w').write(s)
          print(f'Version set: versionCode={run_no}, versionName=1.0.{run_no}')
          PYEOF

      - name: Sync web assets
        run: npx cap sync android

      - name: Install Pillow
        run: pip install Pillow

      - name: Set custom app icon (FIXED - remove adaptive icon)
        run: |
          python3 << 'PYEOF'
          from PIL import Image
          import os, shutil
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          src = Image.open('icon.png').convert('RGBA')
          base = 'android/app/src/main/res'
          anydpi = os.path.join(base, 'mipmap-anydpi-v26')
          if os.path.exists(anydpi):
              shutil.rmtree(anydpi)
              print('removed mipmap-anydpi-v26')
          for root, dirs, files in os.walk(base):
              for f in files:
                  if f in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                      fp = os.path.join(root, f)
                      os.remove(fp)
                      print(f'removed {fp}')
          for folder, size in sizes.items():
              d = os.path.join(base, folder)
              os.makedirs(d, exist_ok=True)
              img = src.resize((size, size), Image.LANCZOS)
              img.save(os.path.join(d, 'ic_launcher.png'))
              img.save(os.path.join(d, 'ic_launcher_round.png'))
          print('FIXED icon set')
          PYEOF

      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            printf '%
