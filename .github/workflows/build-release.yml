name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets
        run: mkdir -p public && cp index.html icon.png icon-192.png manifest.json public/

      - name: Init Capacitor
        run: npx cap init "مدیر خونه" com.omidbahadori.modirkhune --web-dir=public

      - name: Add Android
        run: npx cap add android

      - name: Auto-increment version
        run: |
          python3 << 'PY'
          import re, os
          p='android/app/build.gradle'
          s=open(p).read()
          run_no=int(os.environ.get('GITHUB_RUN_NUMBER','1'))
          s=re.sub(r'versionCode\s+\d+', f'versionCode {run_no}', s)
          s=re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_no}"', s)
          open(p,'w').write(s)
          PY

      - name: Sync
        run: npx cap sync android

      - name: Icon fix
        run: |
          pip install Pillow
          python3 << 'PY'
          from PIL import Image
          import os, shutil
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          src=Image.open('icon.png').convert('RGBA')
          base='android/app/src/main/res'
          for d in list(os.listdir(base)):
              if 'anydpi' in d:
                  shutil.rmtree(os.path.join(base,d), ignore_errors=True)
          for root,_,files in os.walk(base):
              for f in files:
                  if f in ('ic_launcher.xml','ic_launcher_round.xml'):
                      try: os.remove(os.path.join(root,f))
                      except: pass
          for folder,size in sizes.items():
              d=os.path.join(base,folder)
              os.makedirs(d,exist_ok=True)
              img=src.resize((size,size), Image.LANCZOS)
              img.save(os.path.join(d,'ic_launcher.png'))
              img.save(os.path.join(d,'ic_launcher_round.png'))
          PY

      - name: Prepare keystore
        run: cp modirkhune-release.keystore android/app/modirkhune-release.keystore

      - name: Configure signing
        run: |
          python3 << 'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          cfg=" signingConfigs {\n release {\n storeFile file('modirkhune-release.keystore')\n storePassword 'ModirKhune2026#Release!'\n keyAlias 'modirkhune'\n keyPassword 'ModirKhune2026#Release!'\n }\n }\n"
          if 'signingConfigs' not in s:
              s=s.replace('buildTypes {', cfg+'\n buildTypes {')
          s=s.replace('release {\n minifyEnabled false', 'release {\n signingConfig signingConfigs.release\n minifyEnabled false')
          open(p,'w').write(s)
          PY

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
           ls -lh app/build/outputs/apk/release/

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/*.apk modir-khune.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: Auto build release APK
          files: modir-khune.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
