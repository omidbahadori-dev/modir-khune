name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare web assets
        run: mkdir -p public && cp index.html icon.png icon-192.png manifest.json public/

      - name: Init Capacitor
        run: npx cap init "مدیر خونه" com.omidbahadori.modirkhune --web-dir=public

      - name: Add Android
        run: npx cap add android

      - name: Auto-increment version
        run: |
          python3 -c "
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          run_no=${{ github.run_number }}
          s=re.sub(r'versionCode\s+\d+', f'versionCode {run_no}', s)
          s=re.sub(r'versionName\s+\"[^\"]+\"', f'versionName \"1.0.{run_no}\"', s)
          open(p,'w').write(s)
          "

      - name: Sync
        run: npx cap sync android

      - name: Icon fix
        run: |
          pip install Pillow
          python3 -c "
          from PIL import Image
          import os, shutil
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          src=Image.open('icon.png').convert('RGBA')
          base='android/app/src/main/res'
          import pathlib
          [shutil.rmtree(os.path.join(base,d)) for d in os.listdir(base) if 'anydpi' in d]
          for root,_,files in os.walk(base):
              for f in files:
                  if f in ('ic_launcher.xml','ic_launcher_round.xml'):
                      os.remove(os.path.join(root,f))
          for folder,size in sizes.items():
              d=os.path.join(base,folder)
              os.makedirs(d,exist_ok=True)
              img=src.resize((size,size), Image.LANCZOS)
              img.save(os.path.join(d,'ic_launcher.png'))
              img.save(os.path.join(d,'ic_launcher_round.png'))
          "

      - name: Prepare keystore
        run: |
          cp modirkhune-release.keystore android/app/modirkhune-release.keystore
          ls -lh android/app/*.keystore

      - name: Configure signing
        run: |
          python3 -c "
          p='android/app/build.gradle'
          s=open(p).read()
          cfg=''' signingConfigs {
                  release {
                      storeFile file('modirkhune-release.keystore')
                      storePassword 'ModirKhune2026#Release!'
                      keyAlias 'modirkhune'
                      keyPassword 'ModirKhune2026#Release!'
                  }
              }
          '''
          if 'signingConfigs' not in s:
              s=s.replace('buildTypes {', cfg+'\n buildTypes {')
          s=s.replace('release {\n minifyEnabled false', 'release {\n signingConfig signingConfigs.release\n minifyEnabled false')
          open(p,'w').write(s)
          print('signing ok')
          "

      - name: Build Release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          ls -R app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
